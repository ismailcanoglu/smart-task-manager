
name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov httpx ruff

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Ruff format check
        run: python -m ruff format app tests --check

      - name: Run API tests
        env:
          DATABASE_URL: sqlite:///./ci-placeholder.db
        run: |
          python -m pytest tests/ -v --cov=app --cov-branch --cov-report=term-missing
